[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traced-intelligence-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.50.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.3.0",
]
