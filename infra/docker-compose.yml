services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: traced-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traced
    ports:
      - "5434:5432"
    volumes:
      - traced-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: traced-redis
    ports:
      - "6380:6379"

volumes:
  traced-pgdata:
